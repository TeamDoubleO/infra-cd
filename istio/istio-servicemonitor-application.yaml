apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-servicemonitor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/TeamDoubleO/infra-cd.git'
    targetRevision: develop
    path: istio
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
