apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.9.8
    helm:
      values: |
        loki:
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "monitoring"
              effect: "NoSchedule"
          nodeSelector:
            role: monitoring
          persistence:
            enabled: true
            size: 20Gi
            storageClassName: gp3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          config:
            table_manager:
              retention_deletes_enabled: true
              retention_period: 168h
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
        promtail:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
        grafana:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
