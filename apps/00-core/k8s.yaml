apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    arch: outer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        app: rabbitmq-service
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: Always
          ports:
            - containerPort: 5672
            - containerPort: 15672
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
             memory: "512Mi"
             cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

---

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    arch: outer
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  selector:
    app: rabbitmq

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-mobile
  labels:
    arch: outer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-mobile
  template:
    metadata:
      labels:
        app: redis-mobile
    spec:
      nodeSelector:
        app: rabbitmq-service
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"


---

apiVersion: v1
kind: Service
metadata:
  name: redis-mobile
  labels:
    arch: outer
spec:
  selector:
    app: redis-mobile
  ports:
    - port: 6379
      targetPort: 6379


---

