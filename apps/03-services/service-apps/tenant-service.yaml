apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-service
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: "sunwoo11/keywe_tenant_service"
    argocd-image-updater.argoproj.io/update-strategy: newest-build
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: develop
spec:
  project: default
  source:
    repoURL: https://github.com/TeamDoubleO/infra-cd.git
    targetRevision: develop
    path: apps/services/tenant-service
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
