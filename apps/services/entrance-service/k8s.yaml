apiVersion: apps/v1
kind: Deployment
metadata:
  name: entrance-service
  labels:
    arch: inner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entrance-service
  template:
    metadata:
      labels:
        app: entrance-service
        istio: sidecar
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      nodeSelector:
        app: keywe-service
      containers:
        - name: entrance-service
          image: sunwoo11/keywe_entrance_service:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 60008
          env:
            - name: TZ
              value: Asia/Seoul
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: config-server-url
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-port
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-password
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: entrance-service-port
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
                  
---

apiVersion: v1
kind: Service
metadata:
  name: entrance-service
  labels:
    arch: inner
spec:
  selector:
    app: entrance-service
  ports:
    - port: 60008
      targetPort: 60008
      name: http
